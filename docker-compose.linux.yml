# Linux server (Docker Engine) without port forwarding.
#
# Host networking puts nginx directly on the server's network card, so TCP (HTTP/2)
# and QUIC (HTTP/3) both run end to end between client and nginx. Docker Desktop's
# port forwarding terminates TCP but not UDP, which skews the comparison.
#
# Usage on the Linux server:
#   docker compose -f docker-compose.linux.yml up -d --build
#   docker compose -f docker-compose.linux.yml run --rm netem 25ms 2%     # or: reset, show
#   (with root instead: sudo ./scripts/set-network-condition-linux.sh 25ms 2%)

services:
  http2-server:
    build:
      context: .
      dockerfile: nginx/http2/Dockerfile
    network_mode: host
    volumes:
      - ./nginx/http2/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
      - ./scripts:/scripts:ro
    depends_on:
      cert-generator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/scripts/health-check-http2.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  http3-server:
    build:
      context: .
      dockerfile: nginx/http3/Dockerfile
    network_mode: host
    volumes:
      - ./nginx/http3/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
      - ./scripts:/scripts:ro
    depends_on:
      cert-generator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/scripts/health-check-http3.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Applies tc netem to the host's network card; only runs on demand (docker compose run)
  netem:
    build:
      context: .
      dockerfile: scripts/netem.Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./scripts:/scripts:ro
    profiles:
      - tools

  cert-generator:
    image: alpine:latest
    volumes:
      - ./certs:/certs
      - ./scripts:/scripts:ro
    command: /scripts/generate-certs.sh
